name = "SecureMessaging"
defaultTargets = ["SecureMessaging", "ToVCVio"]
# `lake lint` runs Batteries' environment linter (runLinter) over our libraries.
lintDriver = "batteries/runLinter"
lintDriverArgs = [
  "SecureMessaging",
  "ToVCVio",
]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
maxRecDepth = 10000

[[require]]
name = "versoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.34.0"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "3e4d6eccc245a3760d181fc3c2d7ca8e99bfb840"

[[lean_lib]]
name = "ToVCVio"

[[lean_lib]]
name = "SecureMessaging"

[[lean_lib]]
name = "SecureMessagingDocs"
srcDir = "docs"

[[lean_exe]]
name = "secureMessagingDocs"
root = "SecureMessagingDocsMain"

