name = "SecureMessaging"
defaultTargets = ["SecureMessaging", "ToVCVio"]
# `lake lint` runs Batteries' environment linter (runLinter) over our libraries.
lintDriver = "batteries/runLinter"
lintDriverArgs = [
  "SecureMessaging",
  "ToVCVio",
]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
maxRecDepth = 10000

[[require]]
name = "versoBlueprint"
# Temporary: the Lean 4.36 port in leanprover/verso-blueprint#504, from the
# Beneficial-AI-Foundation fork. Switch back to leanprover/verso-blueprint when
# it has a v4.36.0 release.
git = "https://github.com/Beneficial-AI-Foundation/verso-blueprint"
rev = "74b2c9e6784b88778e3482bbd9d5c67bd26a5c0e"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "v4.36.0"

[[lean_lib]]
name = "ToVCVio"

[[lean_lib]]
name = "SecureMessaging"

[[lean_lib]]
name = "SecureMessagingDocs"
srcDir = "docs"

[[lean_exe]]
name = "secureMessagingDocs"
root = "SecureMessagingDocsMain"

