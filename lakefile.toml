name = "SecureMessaging"
defaultTargets = ["SecureMessaging", "ToVCVio"]
# `lake lint` runs Batteries' environment linter (runLinter) over our libraries.
lintDriver = "batteries/runLinter"
lintDriverArgs = [
  "SecureMessaging",
  "ToVCVio",
]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
maxRecDepth = 10000

[[require]]
name = "versoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.35.0"

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "v4.36.0"

# verso-blueprint has no v4.36 release yet and still pins Verso v4.35.0.
# These direct requirements override its pins so that the whole build uses one
# toolchain. Delete them when verso-blueprint moves to v4.36.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.36.0"

[[require]]
name = "verso-slides"
git = "https://github.com/leanprover/verso-slides"
rev = "v4.36.0"

[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "verso-v4.36.0"

# lean-vir main still targets v4.36.0-rc2; this commit on its `feat/lean-4.36.0`
# branch builds with the v4.36.0 Lake.
[[require]]
name = "lean_vir"
git = "https://github.com/ejgallego/lean-vir"
rev = "6547f74c6bc863624ffddd883d213b426e5947f1"

[[lean_lib]]
name = "ToVCVio"

[[lean_lib]]
name = "SecureMessaging"

[[lean_lib]]
name = "SecureMessagingDocs"
srcDir = "docs"

[[lean_exe]]
name = "secureMessagingDocs"
root = "SecureMessagingDocsMain"

