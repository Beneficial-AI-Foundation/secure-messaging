name: CI

on:
  push:
    branches: ["main", "la/add_deploy_page"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"

      - name: Cache Lake build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            lake-build-${{ runner.os }}-

      - name: Build project
        run: lake build

      - name: Build documentation
        run: lake build SecureMessagingDocs

      - name: Generate documentation site
        run: lake env lean --run SecureMessagingDocsMain.lean --output site

      - name: Build literate code docs
        run: lake build :literateHtml

      - name: Assemble site
        run: |
          cp -r .lake/build/literate-html site/code
          cp static/index.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/la/add_deploy_page'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
