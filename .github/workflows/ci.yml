name: CI

on:
  push:
    branches: ["main", "la/add_deploy_page"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "${{ github.repository }}-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-github-cache: "false"
          use-mathlib-cache: "true"

      - name: Restore Lake package cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-packages-v2-

      - name: Restore Lake build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build/lib
            .lake/build/ir
          key: ${{ runner.os }}-lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', '**/*.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-
            ${{ runner.os }}-lake-build-v2-

      - name: Show tool versions
        run: |
          lean --version
          lake --version

      - name: Build project
        run: lake build

      - name: Build documentation
        run: lake build SecureMessagingDocs

      - name: Generate documentation site
        run: lake env lean --run SecureMessagingDocsMain.lean --output _out/site

      - name: Build literate code docs
        run: lake build :literateHtml

      - name: Assemble site
        run: |
          cp -r .lake/build/literate-html _out/site/code
          cp static/index.html _out/site/index.html

      - name: Validate site output
        run: |
          test -f _out/site/index.html
          test -f _out/site/html-multi/index.html
          test -f _out/site/code/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _out/site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
