name: CI

on:
  push:
    branches: ["main", "la/add_deploy_page"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          build: "false"
          use-mathlib-cache: "true"

      - name: Build project
        run: lake build

      - name: Cache docs Lake packages
        uses: actions/cache@v4
        with:
          path: docs/.lake
          key: docs-lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docs/lake-manifest.json') }}
          restore-keys: |
            docs-lake-${{ runner.os }}-

      - name: Fetch docs dependencies
        working-directory: docs
        run: |
          lake resolve-deps
          lake exe cache get || true
          if [ -d .lake/packages/VCVio/.git ]; then
            git -C .lake/packages/VCVio submodule update --init --recursive
          fi

      - name: Build documentation
        working-directory: docs
        run: lake build

      - name: Generate documentation site
        working-directory: docs
        run: lake env lean --run Main.lean --output ../site

      - name: Add landing page
        run: cp static/index.html site/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/la/add_deploy_page'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/la/add_deploy_page'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
