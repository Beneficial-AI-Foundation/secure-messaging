name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main, la/add_deploy_page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Project & Extract Call Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Download or build probe-lean
        id: probe-lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEAN_VERSION=$(sed 's|.*:||' lean-toolchain)
          ASSET="probe-lean-${LEAN_VERSION}-linux-x86_64.tar.gz"
          echo "Looking for pre-built probe-lean for Lean ${LEAN_VERSION}..."

          if gh release download --repo Beneficial-AI-Foundation/probe-lean \
               --pattern "$ASSET" --dir /tmp 2>/dev/null; then
            mkdir -p probe-lean-bin
            tar xzf "/tmp/$ASSET" -C probe-lean-bin
            echo "bin=probe-lean-bin/bin/probe-lean" >> "$GITHUB_OUTPUT"
            echo "Downloaded pre-built probe-lean ($ASSET)"
          else
            echo "No pre-built binary for Lean ${LEAN_VERSION} — building from source..."
            git clone --depth 1 https://github.com/Beneficial-AI-Foundation/probe-lean.git probe-lean

            if ! diff -q lean-toolchain probe-lean/lean-toolchain > /dev/null 2>&1; then
              cp lean-toolchain probe-lean/lean-toolchain
              sed -i "s|rev = \".*\"|rev = \"$LEAN_VERSION\"|" probe-lean/lakefile.toml
              cd probe-lean
              if ! lake update 2>&1; then
                sed -i '/^\s*rev\s*=/d' lakefile.toml
                cp "$GITHUB_WORKSPACE/lean-toolchain" lean-toolchain
                lake update
              fi
              cd "$GITHUB_WORKSPACE"
            fi

            cd probe-lean && lake build probe-lean && cd "$GITHUB_WORKSPACE"
            echo "bin=probe-lean/.lake/build/bin/probe-lean" >> "$GITHUB_OUTPUT"
            echo "Built probe-lean from source"
          fi

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            docs/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Download Mathlib cache
        run: |
          lake exe cache get 2>&1 || echo "cache get returned non-zero (may be partial)"

      - name: Build project
        run: |
          lake build 2>&1 | tee build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          echo "Project built successfully"
          SORRY_COUNT=$(grep -c "declaration uses 'sorry'" build_output.txt || true)
          echo "  sorry warnings detected: $SORRY_COUNT"

      - name: Generate enriched call graph atoms
        run: |
          ${{ steps.probe-lean.outputs.bin }} extract \
            --from-file build_output.txt \
            -o callgraph-atoms.json \
            .
          echo "graph.json generated"
          echo "Atom count: $(python3 -c "import json; d=json.load(open('callgraph-atoms.json')); a=d.get('data',d) if isinstance(d,dict) and 'schema-version' in d else d; print(len(a))")"

      - name: Upload callgraph atoms
        uses: actions/upload-artifact@v4
        with:
          name: callgraph-atoms
          path: callgraph-atoms.json
          retention-days: 1

  callgraph-viewer:
    name: Build Call Graph Viewer
    needs: build
    uses: Beneficial-AI-Foundation/scip-callgraph/.github/workflows/generate-lean-callgraph.yml@main
    with:
      pre_built_atoms: callgraph-atoms
      github_url: https://github.com/Beneficial-AI-Foundation/secure-messaging
      github_branch: ${{ github.ref_name }}
      deploy_mode: subpath
      subpath: secure-messaging/callgraph

  build-docs:
    name: Build Verso Documentation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            .lake
            docs/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'docs/lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build Verso docs
        run: |
          lake -d docs build

      - name: Generate documentation site
        working-directory: docs
        run: |
          lake env lean --run Main.lean --output ../site

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [callgraph-viewer, build-docs]
    if: ${{ !cancelled() && needs.build-docs.result == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Download callgraph viewer
        id: download-callgraph
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: callgraph-viewer
          path: callgraph

      - name: Copy callgraph to site
        if: steps.download-callgraph.outcome == 'success'
        run: |
          mkdir -p site/callgraph
          cp -r callgraph/* site/callgraph/
          echo "Callgraph viewer added to site"

      - name: Checkout static assets
        uses: actions/checkout@v4
        with:
          sparse-checkout: static
          path: repo

      - name: Add root landing page
        run: cp repo/static/index.html site/index.html

      - name: List final site structure
        run: |
          echo "=== Site structure ==="
          find site -type f | head -50
          echo "..."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
