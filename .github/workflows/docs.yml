name: Docs (Verso-Blueprint)

# Builds the Verso-Blueprint docs in vb-poc/ (versoBlueprint-only — no mathlib /
# VCV-io stack, so the build is light and separate from the project build) and:
#   * on ANY repo: uploads the rendered site as a Pages artifact;
#   * ONLY on a fork owned by 'a-dangelo': deploys it to that fork's GitHub Pages
#     (https://a-dangelo.github.io/secure-messaging/), giving the PoC an
#     independent live site without touching the upstream team Pages (whose
#     environment forbids deploys from here anyway).
# On the upstream repo the deploy job is skipped, so CI stays build-only there.

on:
  push:
    branches: [ada/vb-poc, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Cache the Lean toolchain so elan does not re-download v4.29.0 every run.
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('vb-poc/lean-toolchain') }}

      # lean-action, pointed at vb-poc/, installs elan, caches vb-poc/.lake, and
      # runs `lake build` for the SMDocs default target. use-mathlib-cache is
      # false: the docs require versoBlueprint only (no mathlib).
      - name: Build docs library (elan + lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: vb-poc
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Render site to static HTML
        run: lake -d vb-poc env lean --run vb-poc/Main.lean --output vb-poc/_out/site

      - name: Verify site output
        run: |
          test -f vb-poc/_out/site/html-multi/index.html
          test -f vb-poc/_out/site/html-multi/-verso-data/blueprint-preview-manifest.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: vb-poc/_out/site/html-multi

  deploy:
    name: Deploy to fork Pages
    # Runs ONLY on a fork owned by 'a-dangelo' (never on the upstream repo), and
    # never on pull_request events. Publishes to a-dangelo.github.io/secure-messaging/.
    #
    # TODO(remove when the PoC merges into SecureMessaging): the 'a-dangelo' owner
    # gate below — and the a-dangelo references in this file's header comment — are
    # TEMPORARY, only so the PoC can be previewed on a personal fork while it's under
    # review. Once the PoC is approved and merged to SM (this version or astefano's),
    # delete the gate + a-dangelo comments and point the deploy at the team's
    # main/Pages flow, so the merged workflow is clean and fork-agnostic.
    if: github.repository_owner == 'a-dangelo' && github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
