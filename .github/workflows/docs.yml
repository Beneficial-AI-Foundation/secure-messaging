name: Docs (Verso-Blueprint)

# Builds the Verso-Blueprint docs in vb-poc/ and publishes them.
#
# vb-poc/ requires the SecureMessaging library (path="..") so the docs evoke REAL
# declarations with hover/LSP and drift-proof `(lean := "...")` refs. That pulls
# the full VCV-io / mathlib stack, so this is a heavy build — but it is ONE Lake
# workspace: the path-require builds the project IN PLACE at the repo root and the
# docs on top, so the mathlib cloud cache is fetched ONCE (use-mathlib-cache: true)
# and the project is compiled ONCE (no duplicate mathlib materialisation).
#
# MERGE NOTE: on the team repo this docs build would run alongside ci.yml; to avoid
# compiling the project twice on `main`, fold the docs+render+deploy steps into
# ci.yml's single build job (one checkout, one mathlib fetch, one `lake build`).
#
#   * on ANY repo: uploads the rendered site as a Pages artifact;
#   * ONLY on a fork owned by 'a-dangelo': deploys it to that fork's GitHub Pages
#     (https://a-dangelo.github.io/secure-messaging/), an independent live preview
#     that never touches the upstream team Pages.
# On the upstream repo the deploy job is skipped, so CI stays build-only there.

on:
  push:
    branches: [ada/vb-poc, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Cache the Lean toolchain so elan does not re-download v4.29.0 every run.
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('vb-poc/lean-toolchain') }}

      # lean-action, pointed at vb-poc/, installs elan, fetches the mathlib cloud
      # cache ONCE (use-mathlib-cache: true), then builds the SMDocs default
      # target — which transitively compiles the SecureMessaging project (in place
      # at the repo root) and the docs on top — and caches the whole vb-poc/.lake.
      - name: Build docs + project (elan + mathlib cache + lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: vb-poc
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Render site to static HTML
        run: lake -d vb-poc env lean --run vb-poc/Main.lean --output vb-poc/_out/site

      - name: Verify site output
        run: |
          test -f vb-poc/_out/site/html-multi/index.html
          test -f vb-poc/_out/site/html-multi/-verso-data/blueprint-preview-manifest.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: vb-poc/_out/site/html-multi

  deploy:
    name: Deploy to fork Pages
    # Runs ONLY on a fork owned by 'a-dangelo' (never on the upstream repo), and
    # never on pull_request events. Publishes to a-dangelo.github.io/secure-messaging/.
    #
    # TODO(remove when the PoC merges into SecureMessaging): the 'a-dangelo' owner
    # gate below — and the a-dangelo references in this file's header comment — are
    # TEMPORARY, only so the PoC can be previewed on a personal fork while it's under
    # review. Once the PoC is approved and merged to SM (this version or astefano's),
    # delete the gate + a-dangelo comments and point the deploy at the team's
    # main/Pages flow, so the merged workflow is clean and fork-agnostic.
    if: github.repository_owner == 'a-dangelo' && github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
