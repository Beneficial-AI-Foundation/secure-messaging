name: Docs (Verso-Blueprint)

# Builds the Verso-Blueprint documentation site in docs/ and uploads it as a
# downloadable CI artifact for review/preview.
#
# It deliberately does NOT publish to GitHub Pages. This repo has a single Pages
# site whose Source is "GitHub Actions", deployed from `main` by the team's CI
# workflow; the `github-pages` environment is restricted to `main`, so a deploy
# from any other branch is rejected by environment protection. The production
# layout is a SUBPATH deploy (team docs at /, this PoC at /vb-poc/), assembled by
# the coordinated main-branch deploy — not here. See
# .formalising/fv-plans/VB-docs/progress.md for that plan.
#
# The Lean build is delegated to leanprover/lean-action (the same action ci.yml
# uses), so the protocol library and the docs share one toolchain pin and
# mathlib's cloud cache; mathlib is downloaded, never compiled.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lean-action, pointed at docs/, installs elan (pinned by
      # docs/lean-toolchain), runs `lake exe cache get` (downloads mathlib oleans;
      # never compiles mathlib), caches docs/.lake, and runs `lake build` for the
      # SMDocs default target.
      - name: Build docs library (elan + mathlib cache + lake build)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: docs
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true

      # Verso-specific: run the generator to emit the static site.
      - name: Render site to static HTML
        run: lake -d docs env lean --run docs/Main.lean --output docs/_out/site

      - name: Verify site output
        run: |
          test -f docs/_out/site/html-multi/index.html
          test -f docs/_out/site/html-multi/-verso-data/blueprint-preview-manifest.json

      # Downloadable preview (open index.html locally). The production publish is
      # the coordinated subpath deploy on main, not this workflow.
      - name: Upload site as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vb-docs-site
          path: docs/_out/site/html-multi
