name = "SMDocs"
defaultTargets = ["SMDocs"]

# Standalone docs package: requires versoBlueprint ONLY (which pulls verso +
# proofwidgets, NOT mathlib). The protocol library and its VCV-io / mathlib /
# loom2 / Hax stack are intentionally NOT required here, so this docs build stays
# fast and fully separate from the project build. Pinned to versoBlueprint's
# v4.29.0 ref (same Lean toolchain as the project); the manifest locks the SHA.
[[require]]
name = "versoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "v4.29.0"

[[lean_lib]]
name = "SMDocs"

[[lean_exe]]
name = "site"
root = "Main"
